name: TapIt
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.3+6

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  geolocator: ^14.0.2
  flutter_compass: ^0.8.0
  vector_math: ^2.1.4
  webview_flutter: ^4.13.0
  webview_flutter_wkwebview: ^3.23.2
  cupertino_icons: ^1.0.8
  vibration: ^3.1.4
  speech_to_text: ^7.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.1
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/compass.png
    - assets/kaaba_arrow.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
